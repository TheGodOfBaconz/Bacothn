<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bacothn</title>

    <meta
        name="description"
        content="Bacothn. Projects, experiments, bots, games, and whatever else I feel like making."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================
         NAVIGATION
    =================================== -->

    <header class="site-header">

        <a
            href="index.html"
            class="site-logo"
        >
            BACOTHN
        </a>


        <div class="header-right">

            <button
                id="pagesButton"
                class="pages-button"
                type="button"
            >
                <span class="pages-icon">☰</span>
                <span>PAGES</span>
            </button>

        </div>

    </header>



    <!-- ==================================
         PAGE DRAWER
         script.js controls this
    =================================== -->

    <div
        id="pagesDrawer"
        class="pages-drawer"
    >

        <div class="pages-drawer-inner">

            <div class="pages-drawer-title">
                PAGES
            </div>


            <div
                id="pagesList"
                class="pages-list"
            >

                <!-- script.js puts the page buttons here -->

            </div>

        </div>

    </div>



    <!-- ==================================
         MAIN
    =================================== -->

    <main class="home-main">


        <section class="home-hero">


            <div
                id="glitchTitle"
                class="glitch-title"
            >
                BACOTHN
            </div>


            <p class="home-description">
                Projects, experiments, bots, games, and whatever
                else I feel like making.
            </p>


            <div class="home-links">


                <a
                    href="profile.html"
                    class="home-link-button"
                >
                    My Profile
                </a>


                <a
                    href="links.html"
                    class="home-link-button"
                >
                    Social Links
                </a>


            </div>


        </section>


    </main>



    <script src="script.js"></script>

</body>

</html>
