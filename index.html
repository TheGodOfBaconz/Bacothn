<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bacothn</title>

    <meta
        name="description"
        content="Bacothn. Projects, experiments, bots, games, and whatever else I feel like making."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ========================================
           BACON LAUNCHER
        ======================================== */

        .bacon-launcher {
            width: 100%;
            max-width: 650px;
            margin: 35px auto 0;
        }

        .bacon-play-button {
            padding: 13px 22px;

            color: #ff2424;
            background: rgba(255, 0, 0, 0.05);

            border: 1px solid rgba(255, 30, 30, 0.25);
            border-radius: 6px;

            font-family: inherit;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .bacon-play-button:hover {
            color: #ffffff;

            background: rgba(255, 0, 0, 0.1);

            border-color: rgba(255, 40, 40, 0.5);

            transform: translateY(-2px);
        }

        .bacon-play-button:active {
            transform: scale(0.95);
        }


        /* ========================================
           GAME
        ======================================== */

        .bacon-game {
            position: relative;

            width: 100%;
            max-width: 650px;

            min-height: 480px;

            margin: 25px auto 0;
            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    #171717 0%,
                    #0b0b0b 55%,
                    #050505 100%
                );

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;

            overflow: hidden;

            display: none;

            opacity: 0;

            transform:
                scale(0.55)
                rotate(-2deg);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            isolation: isolate;
        }

        .bacon-game.opening {
            display: block;

            animation:
                baconGameOpen
                0.75s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }

        @keyframes baconGameOpen {

            0% {
                opacity: 0;

                transform:
                    scale(0.55)
                    rotate(-3deg);
            }

            40% {
                opacity: 1;

                transform:
                    scale(1.04)
                    rotate(1deg);
            }

            70% {
                transform:
                    scale(0.98)
                    rotate(-0.5deg);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }

        }


        /* ========================================
           CRACKS
        ======================================== */

        .bacon-cracks {
            position: absolute;

            inset: 0;

            z-index: 30;

            pointer-events: none;

            opacity: 0;

            display: none;
        }

        .bacon-cracks.active {
            display: block;

            animation:
                crackFlash
                0.7s
                ease-out
                forwards;
        }

        .crack-line {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 3px;
            height: 170%;

            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.4);

            transform-origin: center;
        }

        .crack-line:nth-child(1) {
            transform: translate(-50%, -50%) rotate(15deg);
        }

        .crack-line:nth-child(2) {
            transform: translate(-50%, -50%) rotate(-25deg);
        }

        .crack-line:nth-child(3) {
            transform: translate(-50%, -50%) rotate(47deg);
        }

        .crack-line:nth-child(4) {
            transform: translate(-50%, -50%) rotate(-58deg);
        }

        .crack-line:nth-child(5) {
            transform: translate(-50%, -50%) rotate(80deg);
        }

        @keyframes crackFlash {

            0% {
                opacity: 0;

                transform: scale(0.4);
            }

            20% {
                opacity: 1;

                transform: scale(1);
            }

            45% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;

                transform: scale(1.15);
            }

        }


        /* ========================================
           EXPLOSION
        ======================================== */

        .bacon-explosion {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 25px;
            height: 25px;

            z-index: 40;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 20px #ffffff,
                0 0 50px rgba(255, 30, 30, 0.9),
                0 0 100px rgba(255, 0, 0, 0.5);

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(0);
        }

        .bacon-explosion.active {
            animation:
                baconExplosion
                0.6s
                ease-out
                forwards;
        }

        @keyframes baconExplosion {

            0% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            35% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(10);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(20);
            }

        }


        /* ========================================
           GAME CONTENT
        ======================================== */

        .bacon-game-content {
            position: relative;

            z-index: 10;

            width: 100%;

            opacity: 0;

            pointer-events: none;

            transform: translateY(15px);
        }

        .bacon-game-content.visible {
            pointer-events: auto;

            animation:
                baconContentReveal
                0.6s
                ease-out
                forwards;
        }

        @keyframes baconContentReveal {

            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* ========================================
           TITLE / SCORE
        ======================================== */

        .bacon-game-title {
            color: #555555;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 4px;

            text-align: center;

            margin-bottom: 8px;
        }

        .bacon-score {
            color: #ffffff;

            font-size: 38px;
            font-weight: 950;

            letter-spacing: -2px;

            text-align: center;
        }

        .bacon-score-label {
            color: #444444;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 3px;

            text-align: center;

            margin-top: 5px;
        }


        /* ========================================
           BACON CLICK AREA
        ======================================== */

        .bacon-click-area {
            position: relative;

            width: 240px;
            height: 220px;

            margin: 30px auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 50;

            pointer-events: auto;
        }


        /* ========================================
           BACON BUTTON
        ======================================== */

        .bacon-button {
            position: relative;

            width: 190px;
            height: 190px;

            padding: 0;
            margin: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: transparent;

            border: 0;

            cursor: pointer;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

            user-select: none;

            -webkit-user-select: none;

            z-index: 60;

            pointer-events: auto;

            transform: scale(1);

            transition:
                filter 0.15s ease;
        }

        .bacon-button:hover {
            filter:
                drop-shadow(
                    0 0 15px
                    rgba(255, 30, 30, 0.18)
                );
        }

        .bacon-button:active {
            transform: scale(0.84);
        }

        .bacon-button img {
            display: block;

            width: 160px;
            height: 160px;

            object-fit: contain;

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;
        }


        /* ========================================
           INITIAL BACON REVEAL
        ======================================== */

        .bacon-button.bacon-reveal img {
            animation:
                baconReveal
                1.15s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }

        @keyframes baconReveal {

            0% {
                opacity: 0;

                transform:
                    scale(0.15)
                    rotate(-360deg);
            }

            35% {
                opacity: 0.35;

                transform:
                    scale(0.55)
                    rotate(-180deg);
            }

            70% {
                opacity: 0.8;

                transform:
                    scale(1.12)
                    rotate(20deg);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);
            }

        }


        /* ========================================
           CLICK POP
        ======================================== */

        .bacon-button.bacon-pop {
            animation:
                baconPop
                0.18s
                cubic-bezier(0.2, 1.5, 0.4, 1);
        }

        @keyframes baconPop {

            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(0.82);
            }

            72% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        /* ========================================
           FLOATING +BACON
        ======================================== */

        .bacon-float {
            position: absolute;

            z-index: 100;

            pointer-events: none;

            color: #ff3030;

            font-size: 14px;
            font-weight: 950;

            transform:
                translate(-50%, 0);

            animation:
                baconFloat
                0.8s
                ease-out
                forwards;
        }

        @keyframes baconFloat {

            from {
                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(1);
            }

            to {
                opacity: 0;

                transform:
                    translate(-50%, -70px)
                    scale(1.15);
            }

        }


        /* ========================================
           COMBO
        ======================================== */

        .bacon-combo {
            min-height: 20px;

            color: #ff2424;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 2px;

            text-align: center;
        }


        /* ========================================
           STATS
        ======================================== */

        .bacon-stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 20px;
        }

        .bacon-stat {
            padding: 12px 8px;

            background:
                rgba(255, 255, 255, 0.025);

            border:
                1px solid
                rgba(255, 255, 255, 0.06);

            border-radius: 6px;

            text-align: center;
        }

        .bacon-stat span {
            display: block;

            color: #444444;

            font-size: 7px;
            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }

        .bacon-stat b {
            color: #bbbbbb;

            font-size: 12px;
        }


        /* ========================================
           SHOP
        ======================================== */

        .bacon-shop {
            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.06);
        }

        .bacon-shop-title {
            color: #555555;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }

        .bacon-upgrades {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;
        }

        .bacon-upgrade {
            padding: 12px;

            color: #aaaaaa;

            background:
                rgba(255, 255, 255, 0.025);

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 6px;

            font-family: inherit;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .bacon-upgrade:hover {
            background:
                rgba(255, 0, 0, 0.05);

            border-color:
                rgba(255, 30, 30, 0.3);
        }

        .bacon-upgrade:active {
            transform: scale(0.97);
        }

        .bacon-upgrade:disabled {
            opacity: 0.35;

            cursor: not-allowed;
        }

        .bacon-upgrade-name {
            display: block;

            color: #eeeeee;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .bacon-upgrade-effect {
            display: block;

            color: #666666;

            font-size: 8px;

            margin-top: 4px;
        }

        .bacon-upgrade-cost {
            display: block;

            color: #ff2424;

            font-size: 8px;
            font-weight: 900;

            margin-top: 7px;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .bacon-game {
                min-height: 450px;

                padding:
                    25px 15px;

                border-radius: 15px;
            }

            .bacon-score {
                font-size: 32px;
            }

            .bacon-click-area {
                width: 220px;
                height: 210px;

                margin-top: 25px;
            }

            .bacon-button {
                width: 190px;
                height: 190px;
            }

            .bacon-button img {
                width: 160px;
                height: 160px;
            }

            .bacon-upgrades {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <!-- ========================================
         BACON CLICKER JAVASCRIPT
    ========================================= -->

    <script>

        const playButton =
            document.getElementById(
                "baconPlayButton"
            );

        const game =
            document.getElementById(
                "baconGame"
            );

        const cracks =
            document.getElementById(
                "baconCracks"
            );

        const explosion =
            document.getElementById(
                "baconExplosion"
            );

        const gameContent =
            document.getElementById(
                "baconGameContent"
            );

        const baconButton =
            document.getElementById(
                "baconButton"
            );

        const clickArea =
            document.getElementById(
                "baconClickArea"
            );

        const score =
            document.getElementById(
                "baconScore"
            );

        const bestDisplay =
            document.getElementById(
                "baconBest"
            );

        const perClickDisplay =
            document.getElementById(
                "baconPerClick"
            );

        const perSecondDisplay =
            document.getElementById(
                "baconPerSecond"
            );

        const comboDisplay =
            document.getElementById(
                "baconCombo"
            );


        let bacon =
            Number(
                localStorage.getItem(
                    "bacothn_bacon"
                )
            ) || 0;


        let best =
            Number(
                localStorage.getItem(
                    "bacothn_bacon_best"
                )
            ) || 0;


        let totalBacon =
            Number(
                localStorage.getItem(
                    "bacothn_total_bacon"
                )
            ) || 0;


        let lastSeen =
            Number(
                localStorage.getItem(
                    "bacothn_last_seen"
                )
            ) || Date.now();


        let perClick = 1;

        let combo = 0;

        let comboTimer = null;

        let gameStarted = false;


        const upgrades = {

            tiny: {
                count: 0,
                baseCost: 50,
                production: 1
            },

            bot: {
                count: 0,
                baseCost: 250,
                production: 5
            },

            supreme: {
                count: 0,
                baseCost: 1000,
                production: 20
            },

            mega: {
                count: 0,
                baseCost: 10000,
                production: 100
            }

        };


        /* ========================================
           LOAD UPGRADES
        ======================================== */

        Object.keys(upgrades).forEach(
            function(key) {

                upgrades[key].count =
                    Number(
                        localStorage.getItem(
                            "bacothn_upgrade_" + key
                        )
                    ) || 0;

            }
        );


        /* ========================================
           NUMBER FORMAT
        ======================================== */

        function formatNumber(number) {

            return Math.floor(number)
                .toLocaleString();

        }


        /* ========================================
           BACON PER SECOND
        ======================================== */

        function getPerSecond() {

            let total = 0;

            Object.keys(upgrades).forEach(
                function(key) {

                    total +=
                        upgrades[key].count *
                        upgrades[key].production;

                }
            );

            return total;

        }


        /* ========================================
           UPGRADE COST
        ======================================== */

        function getUpgradeCost(key) {

            const upgrade =
                upgrades[key];

            return Math.floor(
                upgrade.baseCost *
                Math.pow(
                    1.15,
                    upgrade.count
                )
            );

        }


        /* ========================================
           SAVE
        ======================================== */

        function saveGame() {

            localStorage.setItem(
                "bacothn_bacon",
                bacon
            );

            localStorage.setItem(
                "bacothn_bacon_best",
                best
            );

            localStorage.setItem(
                "bacothn_total_bacon",
                totalBacon
            );

            localStorage.setItem(
                "bacothn_last_seen",
                Date.now()
            );


            Object.keys(upgrades).forEach(
                function(key) {

                    localStorage.setItem(
                        "bacothn_upgrade_" + key,
                        upgrades[key].count
                    );

                }
            );

        }


        /* ========================================
           UI
        ======================================== */

        function updateUI() {

            score.textContent =
                formatNumber(bacon);

            bestDisplay.textContent =
                formatNumber(best);

            perClickDisplay.textContent =
                "+" +
                formatNumber(perClick);

            perSecondDisplay.textContent =
                formatNumber(
                    getPerSecond()
                );


            document.getElementById(
                "tinyCost"
            ).textContent =
                formatNumber(
                    getUpgradeCost("tiny")
                ) +
                " BACON";


            document.getElementById(
                "botCost"
            ).textContent =
                formatNumber(
                    getUpgradeCost("bot")
                ) +
                " BACON";


            document.getElementById(
                "supremeCost"
            ).textContent =
                formatNumber(
                    getUpgradeCost("supreme")
                ) +
                " BACON";


            document.getElementById(
                "megaCost"
            ).textContent =
                formatNumber(
                    getUpgradeCost("mega")
                ) +
                " BACON";


            document.querySelectorAll(
                ".bacon-upgrade"
            ).forEach(
                function(button) {

                    const key =
                        button.dataset.upgrade;

                    button.disabled =
                        bacon <
                        getUpgradeCost(key);

                }
            );

        }


        /* ========================================
           AFK REWARD
        ======================================== */

        const now =
            Date.now();

        const secondsAway =
            Math.max(
                0,
                Math.floor(
                    (now - lastSeen) / 1000
                )
            );

        const cappedSeconds =
            Math.min(
                secondsAway,
                60 * 60 * 8
            );

        const afkReward =
            getPerSecond() *
            cappedSeconds;


        if (afkReward > 0) {

            bacon += afkReward;

            totalBacon += afkReward;

            if (bacon > best) {
                best = bacon;
            }

        }


        /* ========================================
           OPEN GAME
        ======================================== */

        playButton.addEventListener(
            "click",
            function() {

                if (gameStarted) {
                    return;
                }

                gameStarted = true;


                playButton.style.display =
                    "none";


                game.style.display =
                    "block";


                void game.offsetWidth;


                game.classList.add(
                    "opening"
                );


                setTimeout(
                    function() {

                        cracks.classList.add(
                            "active"
                        );

                    },
                    180
                );


                setTimeout(
                    function() {

                        explosion.classList.add(
                            "active"
                        );

                    },
                    400
                );


                setTimeout(
                    function() {

                        gameContent.classList.add(
                            "visible"
                        );


                        baconButton.classList.remove(
                            "bacon-reveal"
                        );

                        void baconButton.offsetWidth;

                        baconButton.classList.add(
                            "bacon-reveal"
                        );


                        baconButton.style.pointerEvents =
                            "auto";

                        clickArea.style.pointerEvents =
                            "auto";


                        updateUI();

                    },
                    600
                );

            }
        );


        /* ========================================
           BACON CLICK
        ======================================== */

        baconButton.addEventListener(
            "click",
            function(event) {

                let amount =
                    perClick;


                combo++;

                clearTimeout(
                    comboTimer
                );


                comboTimer =
                    setTimeout(
                        function() {

                            combo = 0;

                            comboDisplay.textContent =
                                "";

                        },
                        1200
                    );


                if (combo >= 2) {

                    const bonus =
                        Math.min(
                            Math.floor(
                                combo / 5
                            ),
                            10
                        );

                    amount += bonus;

                    comboDisplay.textContent =
                        "COMBO ×" +
                        combo;

                }


                const critical =
                    Math.random() <
                    0.01;


                if (critical) {

                    amount *= 10;

                    comboDisplay.textContent =
                        "CRITICAL BACON! +" +
                        formatNumber(amount);

                }


                bacon += amount;

                totalBacon += amount;


                if (bacon > best) {
                    best = bacon;
                }


                baconButton.classList.remove(
                    "bacon-pop"
                );

                void baconButton.offsetWidth;

                baconButton.classList.add(
                    "bacon-pop"
                );


                const floating =
                    document.createElement(
                        "div"
                    );

                floating.className =
                    "bacon-float";

                floating.textContent =
                    "+" +
                    formatNumber(amount);


                const rect =
                    clickArea.getBoundingClientRect();


                floating.style.left =
                    (
                        event.clientX -
                        rect.left
                    ) +
                    "px";


                floating.style.top =
                    (
                        event.clientY -
                        rect.top
                    ) +
                    "px";


                clickArea.appendChild(
                    floating
                );


                setTimeout(
                    function() {

                        floating.remove();

                    },
                    800
                );


                updateUI();

                saveGame();

            }
        );


        /* ========================================
           UPGRADES
        ======================================== */

        document.querySelectorAll(
            ".bacon-upgrade"
        ).forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const key =
                            button.dataset.upgrade;

                        const cost =
                            getUpgradeCost(key);


                        if (bacon < cost) {
                            return;
                        }


                        bacon -= cost;

                        upgrades[key].count++;


                        saveGame();

                        updateUI();

                    }
                );

            }
        );


        /* ========================================
           AUTO CLICKERS
        ======================================== */

        setInterval(
            function() {

                const production =
                    getPerSecond();


                if (
                    production <= 0
                ) {
                    return;
                }


                bacon += production;

                totalBacon += production;


                if (bacon > best) {
                    best = bacon;
                }


                updateUI();

                saveGame();

            },
            1000
        );


        /* ========================================
           INITIALIZE
        ======================================== */

        updateUI();

        saveGame();

    </script>

         SITE SCRIPT
    ========================================= -->

    <script src="script.js"></script>
