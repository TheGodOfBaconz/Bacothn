<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Error — Bacothn</title>

    <meta
        name="description"
        content="Something went wrong."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ========================================
         NAVBAR
    ========================================= -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            BACOTHN
        </a>


        <button
            id="pagesButton"
            class="page-menu-button"
            type="button"
        >

            <span class="page-menu-button-icon">
                ☰
            </span>

            <span>
                PAGES
            </span>

        </button>

    </header>



    <!-- ========================================
         PAGE MENU
    ========================================= -->

    <div
        id="pagesDrawer"
        class="page-menu"
    >

        <div class="page-menu-inner">

            <div class="page-menu-label">
                PAGES
            </div>


            <div
                id="pagesList"
                class="page-menu-scroll"
            >

                <div class="page-menu-list">

                    <!-- script.js adds the page buttons -->

                </div>

            </div>

        </div>

    </div>



    <!-- ========================================
         ERROR
    ========================================= -->

    <main class="error-page">

        <section class="error-content">

            <div class="error-code">
                404
            </div>

            <div class="error-label">
                PAGE NOT FOUND
            </div>

            <h1>
                yeah... that's not here.
            </h1>

            <p>
                Whatever you were looking for either doesn't exist,
                moved somewhere else, or I probably forgot to make it.
            </p>


            <a
                href="index.html"
                class="error-home-button"
            >
                RETURN HOME
            </a>

        </section>

    </main>



    <script src="script.js"></script>

</body>

</html>
