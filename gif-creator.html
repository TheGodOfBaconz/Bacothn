<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GIF Creator — Bacothn</title>

    <meta
        name="description"
        content="Create customizable GIFs directly in your browser."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           GIF CREATOR
        ===================================================== */

        .gif-page {

            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding:
                70px 20px 80px;

        }


        .gif-header {

            margin-bottom: 35px;

        }


        .gif-eyebrow {

            color: #555;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 4px;

            margin-bottom: 12px;

        }


        .gif-header h1 {

            margin: 0;

            color: #fff;

            font-size:
                clamp(32px, 7vw, 64px);

            font-weight: 950;

            letter-spacing: -3px;

        }


        .gif-header p {

            max-width: 650px;

            color: #666;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =====================================================
           PANELS
        ===================================================== */

        .gif-panel {

            padding: 20px;

            margin-bottom: 15px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid
                rgba(255,255,255,0.07);

            border-radius: 10px;

        }


        .gif-panel-title {

            color: #777;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 3px;

            margin-bottom: 15px;

        }


        /* =====================================================
           INPUTS
        ===================================================== */

        .gif-input {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            color: #eee;

            background:
                rgba(0,0,0,0.35);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 6px;

            outline: none;

            font-family: inherit;

        }


        .gif-input:focus {

            border-color:
                rgba(255,40,40,0.5);

        }


        .gif-settings-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

        }


        .gif-setting label {

            display: block;

            color: #555;

            font-size: 8px;
            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 6px;

        }


        @media(max-width:700px) {

            .gif-settings-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =====================================================
           ADD BUTTONS
        ===================================================== */

        .gif-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }


        .gif-button {

            padding:
                11px 15px;

            color: #ccc;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 6px;

            font-family: inherit;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        .gif-button:hover {

            color: #fff;

            background:
                rgba(255,0,0,0.07);

            border-color:
                rgba(255,40,40,0.3);

        }


        .gif-button.primary {

            color: #ff3030;

            border-color:
                rgba(255,30,30,0.3);

        }


        .gif-button.danger {

            color: #ff5555;

        }


        /* =====================================================
           FRAMES
        ===================================================== */

        .gif-frames {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(160px, 1fr));

            gap: 10px;

        }


        .gif-frame {

            position: relative;

            overflow: hidden;

            padding: 8px;

            background:
                rgba(0,0,0,0.3);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 8px;

            cursor: grab;

        }


        .gif-frame.dragging {

            opacity: 0.45;

        }


        .gif-frame-preview {

            width: 100%;

            height: 120px;

            object-fit: contain;

            background:
                repeating-conic-gradient(
                    #111 0 25%,
                    #181818 0 50%
                )
                50% / 12px 12px;

            border-radius: 5px;

        }


        .gif-frame-number {

            position: absolute;

            left: 13px;
            top: 13px;

            padding: 4px 6px;

            color: #fff;

            background:
                rgba(0,0,0,0.75);

            border-radius: 4px;

            font-size: 8px;
            font-weight: 900;

        }


        .gif-frame-remove {

            position: absolute;

            right: 10px;
            top: 10px;

            width: 25px;
            height: 25px;

            color: #fff;

            background:
                rgba(180,0,0,0.75);

            border: 0;

            border-radius: 5px;

            cursor: pointer;

        }


        .gif-frame-controls {

            margin-top: 8px;

        }


        .gif-frame-controls label {

            display: block;

            color: #555;

            font-size: 8px;
            font-weight: 900;

            margin-bottom: 4px;

        }


        .gif-duration {

            width: 100%;

            box-sizing: border-box;

            padding: 7px;

            color: #ddd;

            background:
                #101010;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 4px;

        }


        /* =====================================================
           URL BOX
        ===================================================== */

        .gif-url-row {

            display: flex;

            gap: 8px;

        }


        .gif-url-row .gif-input {

            flex: 1;

        }


        @media(max-width:600px) {

            .gif-url-row {

                flex-direction: column;

            }

        }


        /* =====================================================
           PREVIEW
        ===================================================== */

        .gif-preview {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 300px;

            padding: 15px;

            background:
                #080808;

            border:
                1px solid
                rgba(255,255,255,0.06);

            border-radius: 8px;

        }


        .gif-preview img {

            max-width: 100%;

            max-height: 450px;

            object-fit: contain;

        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .gif-progress {

            margin-top: 15px;

        }


        .gif-progress-track {

            height: 6px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.06);

            border-radius: 10px;

        }


        .gif-progress-bar {

            width: 0%;

            height: 100%;

            background: #ff3030;

            transition:
                width 0.15s ease;

        }


        .gif-progress-text {

            margin-top: 8px;

            color: #555;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1px;

        }


        .gif-empty {

            padding: 30px;

            color: #444;

            text-align: center;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 2px;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            BACOTHN
        </a>


        <button
            id="pagesButton"
            class="page-menu-button"
            type="button"
            aria-expanded="false"
            aria-controls="pagesDrawer"
        >

            <span class="page-menu-button-icon">
                ☰
            </span>

            <span>
                PAGES
            </span>

        </button>

    </header>



    <!-- =====================================================
         PAGE MENU
    ===================================================== -->

    <div
        id="pagesDrawer"
        class="page-menu"
        aria-hidden="true"
    >

        <div class="page-menu-inner">

            <div class="page-menu-label">
                PAGES
            </div>


            <div
                id="pagesList"
                class="page-menu-scroll"
            >

                <div class="page-menu-list"></div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="gif-page">


        <header class="gif-header">

            <div class="gif-eyebrow">
                BACOTHN / GIF CREATOR
            </div>

            <h1>
                MAKE A GIF.
            </h1>

            <p>
                Add images, reorder them, adjust each frame,
                crop them, resize them, preview the result,
                and export your GIF directly in your browser.
            </p>

        </header>



        <!-- =================================================
             SETTINGS
        ================================================= -->

        <section class="gif-panel">

            <div class="gif-panel-title">
                GIF SETTINGS
            </div>


            <div class="gif-settings-grid">


                <div class="gif-setting">

                    <label>
                        FILE NAME
                    </label>

                    <input
                        id="gifName"
                        class="gif-input"
                        type="text"
                        value="bacothn.gif"
                        maxlength="100"
                    >

                </div>


                <div class="gif-setting">

                    <label>
                        WIDTH
                    </label>

                    <input
                        id="gifWidth"
                        class="gif-input"
                        type="number"
                        value="500"
                        min="1"
                        max="1200"
                    >

                </div>


                <div class="gif-setting">

                    <label>
                        HEIGHT
                    </label>

                    <input
                        id="gifHeight"
                        class="gif-input"
                        type="number"
                        value="500"
                        min="1"
                        max="1200"
                    >

                </div>


                <div class="gif-setting">

                    <label>
                        LOOP
                    </label>

                    <select
                        id="gifLoop"
                        class="gif-input"
                    >

                        <option value="0">
                            INFINITE
                        </option>

                        <option value="1">
                            ONCE
                        </option>

                    </select>

                </div>


            </div>

        </section>



        <!-- =================================================
             ADD FRAMES
        ================================================= -->

        <section class="gif-panel">

            <div class="gif-panel-title">
                ADD FRAMES
            </div>


            <div class="gif-actions">

                <button
                    id="uploadButton"
                    class="gif-button primary"
                    type="button"
                >
                    + ADD IMAGES
                </button>


                <button
                    id="clearButton"
                    class="gif-button danger"
                    type="button"
                >
                    CLEAR ALL
                </button>

            </div>


            <input
                id="imageInput"
                type="file"
                accept="image/*"
                multiple
                hidden
            >


            <div
                class="gif-url-row"
                style="margin-top:12px;"
            >

                <input
                    id="imageUrl"
                    class="gif-input"
                    type="url"
                    placeholder="Paste an image URL..."
                >


                <button
                    id="addUrlButton"
                    class="gif-button"
                    type="button"
                >
                    ADD URL
                </button>

            </div>

        </section>



        <!-- =================================================
             FRAMES
        ================================================= -->

        <section class="gif-panel">

            <div class="gif-panel-title">
                FRAMES — DRAG TO REORDER
            </div>


            <div
                id="frames"
                class="gif-frames"
            >

                <div
                    id="emptyFrames"
                    class="gif-empty"
                >
                    ADD SOME IMAGES TO BEGIN.
                </div>

            </div>

        </section>



        <!-- =================================================
             PREVIEW
        ================================================= -->

        <section class="gif-panel">

            <div class="gif-panel-title">
                PREVIEW
            </div>


            <div
                id="preview"
                class="gif-preview"
            >

                <div class="gif-empty">
                    NO GIF YET.
                </div>

            </div>

        </section>



        <!-- =================================================
             EXPORT
        ================================================= -->

        <section class="gif-panel">

            <div class="gif-panel-title">
                EXPORT
            </div>


            <div class="gif-actions">

                <button
                    id="createButton"
                    class="gif-button primary"
                    type="button"
                >
                    CREATE GIF
                </button>


                <button
                    id="stopButton"
                    class="gif-button danger"
                    type="button"
                    disabled
                >
                    STOP
                </button>

            </div>


            <div
                id="progress"
                class="gif-progress"
                hidden
            >

                <div class="gif-progress-track">

                    <div
                        id="progressBar"
                        class="gif-progress-bar"
                    ></div>

                </div>


                <div
                    id="progressText"
                    class="gif-progress-text"
                >
                    STARTING...
                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         GIF.JS
    ===================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>



    <!-- =====================================================
         GIF CREATOR SCRIPT
    ===================================================== -->

    <script>

        const imageInput =
            document.getElementById(
                "imageInput"
            );

        const uploadButton =
            document.getElementById(
                "uploadButton"
            );

        const addUrlButton =
            document.getElementById(
                "addUrlButton"
            );

        const imageUrl =
            document.getElementById(
                "imageUrl"
            );

        const framesContainer =
            document.getElementById(
                "frames"
            );

        const emptyFrames =
            document.getElementById(
                "emptyFrames"
            );

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const createButton =
            document.getElementById(
                "createButton"
            );

        const stopButton =
            document.getElementById(
                "stopButton"
            );

        const preview =
            document.getElementById(
                "preview"
            );

        const progress =
            document.getElementById(
                "progress"
            );

        const progressBar =
            document.getElementById(
                "progressBar"
            );

        const progressText =
            document.getElementById(
                "progressText"
            );


        const gifWidth =
            document.getElementById(
                "gifWidth"
            );

        const gifHeight =
            document.getElementById(
                "gifHeight"
            );

        const gifName =
            document.getElementById(
                "gifName"
            );

        const gifLoop =
            document.getElementById(
                "gifLoop"
            );


        let frames = [];

        let currentGif = null;

        let stopped = false;


        /* =====================================================
           LOAD IMAGE
        ===================================================== */

        function loadImage(
            source,
            crossOrigin = true
        ) {

            return new Promise(
                function(resolve, reject) {

                    const img =
                        new Image();


                    if (crossOrigin) {

                        img.crossOrigin =
                            "anonymous";

                    }


                    img.onload =
                        function() {

                            resolve(img);

                        };


                    img.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not load image."
                                )
                            );

                        };


                    img.src =
                        source;

                }
            );

        }


        /* =====================================================
           ADD LOCAL FILE
        ===================================================== */

        function addFile(file) {

            if (
                !file ||
                !file.type.startsWith("image/")
            ) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    frames.push({

                        source:
                            event.target.result,

                        name:
                            file.name,

                        duration:
                            500,

                        type:
                            "data"

                    });


                    renderFrames();

                };


            reader.readAsDataURL(
                file
            );

        }


        /* =====================================================
           FILE INPUT
        ===================================================== */

        uploadButton.addEventListener(
            "click",
            function() {

                imageInput.click();

            }
        );


        imageInput.addEventListener(
            "change",
            function() {

                Array.from(
                    imageInput.files
                ).forEach(
                    function(file) {

                        addFile(file);

                    }
                );


                imageInput.value = "";

            }
        );



        /* =====================================================
           ADD URL
        ===================================================== */

        addUrlButton.addEventListener(
            "click",
            async function() {

                const url =
                    imageUrl.value.trim();


                if (!url) {
                    return;
                }


                try {

                    await loadImage(
                        url
                    );


                    frames.push({

                        source:
                            url,

                        name:
                            url.split("/").pop() ||
                            "URL IMAGE",

                        duration:
                            500,

                        type:
                            "url"

                    });


                    imageUrl.value = "";

                    renderFrames();


                } catch (error) {

                    alert(
                        "That image could not be loaded. The website may block cross-origin image access."
                    );

                }

            }
        );



        /* =====================================================
           RENDER FRAMES
        ===================================================== */

        function renderFrames() {

            framesContainer.innerHTML = "";


            if (frames.length === 0) {

                framesContainer.appendChild(
                    emptyFrames
                );

                return;

            }


            frames.forEach(
                function(frame, index) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "gif-frame";


                    card.draggable =
                        true;


                    card.dataset.index =
                        index;


                    card.innerHTML = `

                        <div class="gif-frame-number">
                            ${index + 1}
                        </div>

                        <button
                            class="gif-frame-remove"
                            type="button"
                            title="Remove frame"
                        >
                            ×
                        </button>

                        <img
                            class="gif-frame-preview"
                            src="${escapeAttribute(frame.source)}"
                            alt="Frame ${index + 1}"
                        >

                        <div class="gif-frame-controls">

                            <label>
                                DURATION (MS)
                            </label>

                            <input
                                class="gif-duration"
                                type="number"
                                min="20"
                                max="10000"
                                value="${frame.duration}"
                            >

                        </div>

                    `;


                    const removeButton =
                        card.querySelector(
                            ".gif-frame-remove"
                        );


                    removeButton.addEventListener(
                        "click",
                        function() {

                            frames.splice(
                                index,
                                1
                            );


                            renderFrames();

                        }
                    );


                    const durationInput =
                        card.querySelector(
                            ".gif-duration"
                        );


                    durationInput.addEventListener(
                        "input",
                        function() {

                            frame.duration =
                                Math.max(
                                    20,
                                    Number(
                                        durationInput.value
                                    ) || 500
                                );

                        }
                    );


                    /*
                        Dragging.
                    */

                    card.addEventListener(
                        "dragstart",
                        function() {

                            card.classList.add(
                                "dragging"
                            );

                        }
                    );


                    card.addEventListener(
                        "dragend",
                        function() {

                            card.classList.remove(
                                "dragging"
                            );

                        }
                    );


                    card.addEventListener(
                        "dragover",
                        function(event) {

                            event.preventDefault();

                        }
                    );


                    card.addEventListener(
                        "drop",
                        function(event) {

                            event.preventDefault();


                            const fromIndex =
                                Number(
                                    event.dataTransfer.getData(
                                        "text/plain"
                                    )
                                );


                            if (
                                Number.isNaN(
                                    fromIndex
                                )
                            ) {

                                return;

                            }


                            const moved =
                                frames.splice(
                                    fromIndex,
                                    1
                                )[0];


                            frames.splice(
                                index,
                                0,
                                moved
                            );


                            renderFrames();

                        }
                    );


                    card.addEventListener(
                        "dragstart",
                        function(event) {

                            event.dataTransfer.setData(
                                "text/plain",
                                index
                            );

                        }
                    );


                    framesContainer.appendChild(
                        card
                    );

                }
            );

        }



        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeAttribute(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );

        }



        /* =====================================================
           CLEAR
        ===================================================== */

        clearButton.addEventListener(
            "click",
            function() {

                frames = [];

                preview.innerHTML = `
                    <div class="gif-empty">
                        NO GIF YET.
                    </div>
                `;

                renderFrames();

            }
        );



        /* =====================================================
           CREATE CANVAS FRAME
        ===================================================== */

        async function makeCanvasFrame(
            frame
        ) {

            const img =
                await loadImage(
                    frame.source
                );


            const width =
                Math.max(
                    1,
                    Number(
                        gifWidth.value
                    ) || 500
                );


            const height =
                Math.max(
                    1,
                    Number(
                        gifHeight.value
                    ) || 500
                );


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                width;


            canvas.height =
                height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
                Cover-fit crop.

                This makes the image fill
                the GIF dimensions without
                stretching it.
            */

            const scale =
                Math.max(
                    width / img.naturalWidth,
                    height / img.naturalHeight
                );


            const drawWidth =
                img.naturalWidth *
                scale;


            const drawHeight =
                img.naturalHeight *
                scale;


            const x =
                (width - drawWidth) / 2;


            const y =
                (height - drawHeight) / 2;


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            ctx.drawImage(
                img,
                x,
                y,
                drawWidth,
                drawHeight
            );


            return canvas;

        }



        /* =====================================================
           CREATE GIF
        ===================================================== */

        createButton.addEventListener(
            "click",
            async function() {

                if (
                    frames.length === 0
                ) {

                    alert(
                        "Add at least one image first."
                    );

                    return;

                }


                stopped = false;


                createButton.disabled =
                    true;

                stopButton.disabled =
                    false;

                progress.hidden =
                    false;


                progressBar.style.width =
                    "0%";


                progressText.textContent =
                    "LOADING FRAMES...";


                try {

                    const width =
                        Math.max(
                            1,
                            Number(
                                gifWidth.value
                            ) || 500
                        );


                    const height =
                        Math.max(
                            1,
                            Number(
                                gifHeight.value
                            ) || 500
                        );


                    currentGif =
                        new GIF({

                            workers: 2,

                            quality: 10,

                            width:
                                width,

                            height:
                                height,

                            repeat:
                                Number(
                                    gifLoop.value
                                ),

                            workerScript:
                                "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"

                        });


                    for (
                        let i = 0;
                        i < frames.length;
                        i++
                    ) {

                        if (stopped) {
                            throw new Error(
                                "STOPPED"
                            );
                        }


                        progressText.textContent =
                            `PREPARING FRAME ${i + 1} / ${frames.length}`;


                        const canvas =
                            await makeCanvasFrame(
                                frames[i]
                            );


                        currentGif.addFrame(
                            canvas,
                            {
                                delay:
                                    frames[i].duration,

                                copy: true
                            }
                        );


                        const percent =
                            Math.round(
                                (
                                    (i + 1) /
                                    frames.length
                                ) *
                                35
                            );


                        progressBar.style.width =
                            `${percent}%`;

                    }


                    progressText.textContent =
                        "ENCODING GIF...";


                    currentGif.on(
                        "progress",
                        function(value) {

                            if (stopped) {
                                return;
                            }


                            /*
                                gif.js reports 0-1.

                                Frames are already
                                prepared, so encoding
                                gets the remaining
                                65%.
                            */

                            const percent =
                                35 +
                                Math.round(
                                    value * 65
                                );


                            progressBar.style.width =
                                `${percent}%`;


                            progressText.textContent =
                                `ENCODING GIF... ${percent}%`;

                        }
                    );


                    currentGif.on(
                        "finished",
                        function(blob) {

                            if (stopped) {
                                return;
                            }


                            progressBar.style.width =
                                "100%";


                            progressText.textContent =
                                "GIF COMPLETE!";


                            const url =
                                URL.createObjectURL(
                                    blob
                                );


                            preview.innerHTML = "";


                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                url;


                            img.alt =
                                "Generated GIF";


                            preview.appendChild(
                                img
                            );


                            const download =
                                document.createElement(
                                    "a"
                                );


                            download.href =
                                url;


                            download.download =
                                getGifFileName();


                            download.textContent =
                                "DOWNLOAD GIF";


                            download.className =
                                "gif-button primary";


                            download.style.display =
                                "inline-block";


                            download.style.marginTop =
                                "12px";


                            preview.appendChild(
                                download
                            );


                            createButton.disabled =
                                false;


                            stopButton.disabled =
                                true;


                            currentGif =
                                null;

                        }
                    );


                    currentGif.on(
                        "abort",
                        function() {

                            progressText.textContent =
                                "ENCODING STOPPED.";

                            createButton.disabled =
                                false;

                            stopButton.disabled =
                                true;

                        }
                    );


                    currentGif.render();


                } catch (error) {

                    if (
                        error.message ===
                        "STOPPED"
                    ) {

                        progressText.textContent =
                            "CANCELLED.";

                    } else {

                        console.error(
                            error
                        );


                        progressText.textContent =
                            "ERROR CREATING GIF.";


                        alert(
                            "The GIF could not be created. Check the browser console for details."
                        );

                    }


                    createButton.disabled =
                        false;


                    stopButton.disabled =
                        true;


                    currentGif =
                        null;

                }

            }
        );



        /* =====================================================
           STOP
        ===================================================== */

        stopButton.addEventListener(
            "click",
            function() {

                stopped = true;


                if (currentGif) {

                    try {

                        currentGif.abort();

                    } catch (error) {
                        /* Ignore abort errors. */

                    }

                }


                createButton.disabled =
                    false;


                stopButton.disabled =
                    true;


                progressText.textContent =
                    "CANCELLED.";

            }
        );



        /* =====================================================
           FILE NAME
        ===================================================== */

        function getGifFileName() {

            let name =
                gifName.value.trim();


            if (!name) {

                name =
                    "bacothn.gif";

            }


            if (
                !name
                    .toLowerCase()
                    .endsWith(".gif")
            ) {

                name += ".gif";

            }


            return name;

        }



        /* =====================================================
           INITIALIZE
        ===================================================== */

        renderFrames();

    </script>
