<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GIF Creator — Bacothn</title>

    <meta
        name="description"
        content="Create GIFs directly in your browser."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           GIF CREATOR
        ===================================================== */

        .gif-page {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding:
                80px 20px 80px;

        }


        .gif-header {

            margin-bottom: 30px;

        }


        .gif-eyebrow {

            color: #555;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 4px;

            margin-bottom: 10px;

        }


        .gif-header h1 {

            margin: 0;

            color: #fff;

            font-size: clamp(
                30px,
                6vw,
                60px
            );

            font-weight: 950;

            letter-spacing: -3px;

        }


        .gif-header p {

            max-width: 650px;

            margin-top: 12px;

            color: #666;

            line-height: 1.7;

        }


        /* =====================================================
           PANELS
        ===================================================== */

        .gif-panel {

            margin-bottom: 15px;

            padding: 20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.025
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 10px;

        }


        .gif-panel-title {

            margin-bottom: 15px;

            color: #aaa;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 3px;

        }


        /* =====================================================
           DROP AREA
        ===================================================== */

        .gif-drop {

            min-height: 150px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 25px;

            text-align: center;

            border:
                1px dashed
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            border-radius: 8px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .gif-drop:hover,
        .gif-drop.dragging {

            background:
                rgba(
                    255,
                    0,
                    0,
                    0.05
                );

            border-color:
                rgba(
                    255,
                    30,
                    30,
                    0.5
                );

        }


        .gif-drop strong {

            color: #eee;

            font-size: 12px;

            letter-spacing: 1px;

        }


        .gif-drop span {

            color: #555;

            font-size: 9px;

        }


        #fileInput {

            display: none;

        }


        /* =====================================================
           URL INPUT
        ===================================================== */

        .url-row {

            display: flex;

            gap: 8px;

            margin-top: 12px;

        }


        .gif-input {

            width: 100%;

            padding: 12px;

            color: #eee;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 6px;

            outline: none;

            font-family: inherit;

            font-size: 11px;

        }


        .gif-input:focus {

            border-color:
                rgba(
                    255,
                    40,
                    40,
                    0.5
                );

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .gif-button {

            padding:
                11px 15px;

            color: #aaa;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            border-radius: 6px;

            font-family: inherit;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

            white-space: nowrap;

            transition:
                0.2s ease;

        }


        .gif-button:hover {

            color: #fff;

            background:
                rgba(
                    255,
                    0,
                    0,
                    0.08
                );

            border-color:
                rgba(
                    255,
                    40,
                    40,
                    0.35
                );

        }


        .gif-button.primary {

            color: #fff;

            background:
                rgba(
                    255,
                    20,
                    20,
                    0.12
                );

            border-color:
                rgba(
                    255,
                    40,
                    40,
                    0.35
                );

        }


        .gif-button:disabled {

            opacity: 0.35;

            cursor: not-allowed;

        }


        /* =====================================================
           MEDIA LIST
        ===================================================== */

        .media-list {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        150px,
                        1fr
                    )
                );

            gap: 10px;

            margin-top: 15px;

        }


        .media-item {

            position: relative;

            min-height: 150px;

            overflow: hidden;

            background: #080808;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 8px;

        }


        .media-item img,
        .media-item video {

            width: 100%;

            height: 120px;

            display: block;

            object-fit: contain;

            background: #000;

        }


        .media-info {

            padding: 8px;

        }


        .media-name {

            overflow: hidden;

            color: #aaa;

            font-size: 8px;

            white-space: nowrap;

            text-overflow: ellipsis;

        }


        .media-type {

            margin-top: 3px;

            color: #444;

            font-size: 7px;

            font-weight: 900;

        }


        .media-remove {

            position: absolute;

            top: 5px;

            right: 5px;

            width: 25px;

            height: 25px;

            color: #fff;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.75
                );

            border: 0;

            border-radius: 5px;

            cursor: pointer;

        }


        .empty-media {

            padding: 30px;

            color: #444;

            text-align: center;

            font-size: 9px;

            letter-spacing: 2px;

        }


        /* =====================================================
           SETTINGS GRID
        ===================================================== */

        .settings-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 10px;

        }


        .setting {

            padding: 12px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.02
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border-radius: 6px;

        }


        .setting label {

            display: block;

            margin-bottom: 6px;

            color: #555;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        .setting input,
        .setting select {

            width: 100%;

            padding: 8px;

            color: #ddd;

            background: #0b0b0b;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 5px;

            font-family: inherit;

        }


        /* =====================================================
           PREVIEW
        ===================================================== */

        .preview-box {

            min-height: 250px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                repeating-conic-gradient(
                    #111 0% 25%,
                    #090909 0% 50%
                )
                50% /
                20px 20px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 8px;

        }


        .preview-box img {

            max-width: 100%;

            max-height: 500px;

            object-fit: contain;

        }


        .preview-empty {

            color: #444;

            font-size: 9px;

            letter-spacing: 2px;

        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-wrap {

            display: none;

            margin-top: 15px;

        }


        .progress-wrap.show {

            display: block;

        }


        .progress-bar {

            width: 100%;

            height: 7px;

            overflow: hidden;

            background: #111;

            border-radius: 99px;

        }


        .progress-fill {

            width: 0%;

            height: 100%;

            background: #ff2424;

            transition:
                width 0.15s linear;

        }


        .progress-text {

            margin-top: 7px;

            color: #555;

            font-size: 8px;

            text-align: right;

        }


        .gif-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 15px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 650px
        ) {

            .gif-page {

                padding:
                    60px 15px;

            }


            .settings-grid {

                grid-template-columns:
                    1fr;

            }


            .url-row {

                flex-direction:
                    column;

            }


            .gif-button {

                width: 100%;

            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         CREATOR SCRIPT
    ===================================================== -->

    <script>

        const fileInput =
            document.getElementById(
                "fileInput"
            );


        const dropZone =
            document.getElementById(
                "dropZone"
            );


        const mediaList =
            document.getElementById(
                "mediaList"
            );


        const urlInput =
            document.getElementById(
                "urlInput"
            );


        const addUrlButton =
            document.getElementById(
                "addUrlButton"
            );


        const createButton =
            document.getElementById(
                "createButton"
            );


        const clearButton =
            document.getElementById(
                "clearButton"
            );


        const previewBox =
            document.getElementById(
                "previewBox"
            );


        const downloadButton =
            document.getElementById(
                "downloadButton"
            );


        const progressWrap =
            document.getElementById(
                "progressWrap"
            );


        const progressFill =
            document.getElementById(
                "progressFill"
            );


        const progressText =
            document.getElementById(
                "progressText"
            );


        let mediaItems = [];

        let finalGifURL = null;


        /* =================================================
           ADD MEDIA
        ================================================= */

        function addMedia(
            source,
            type,
            name
        ) {

            mediaItems.push({

                source:
                    source,

                type:
                    type,

                name:
                    name

            });


            renderMedia();

        }


        /* =================================================
           FILE INPUT
        ================================================= */

        fileInput.addEventListener(
            "change",
            function() {

                const files =
                    Array.from(
                        fileInput.files
                    );


                files.forEach(
                    function(file) {

                        const url =
                            URL.createObjectURL(
                                file
                            );


                        const type =
                            file.type.startsWith(
                                "video/"
                            )
                                ? "video"
                                : "image";


                        addMedia(
                            url,
                            type,
                            file.name
                        );

                    }
                );


                fileInput.value = "";

            }
        );


        /* =================================================
           DRAG AND DROP
        ================================================= */

        [
            "dragenter",
            "dragover"
        ].forEach(
            function(eventName) {

                dropZone.addEventListener(
                    eventName,
                    function(event) {

                        event.preventDefault();

                        dropZone.classList.add(
                            "dragging"
                        );

                    }
                );

            }
        );


        [
            "dragleave",
            "drop"
        ].forEach(
            function(eventName) {

                dropZone.addEventListener(
                    eventName,
                    function(event) {

                        event.preventDefault();

                        dropZone.classList.remove(
                            "dragging"
                        );

                    }
                );

            }
        );


        dropZone.addEventListener(
            "drop",
            function(event) {

                const files =
                    Array.from(
                        event.dataTransfer.files
                    );


                files.forEach(
                    function(file) {

                        const url =
                            URL.createObjectURL(
                                file
                            );


                        const type =
                            file.type.startsWith(
                                "video/"
                            )
                                ? "video"
                                : "image";


                        addMedia(
                            url,
                            type,
                            file.name
                        );

                    }
                );

            }
        );


        /* =================================================
           URL INPUT
        ================================================= */

        addUrlButton.addEventListener(
            "click",
            function() {

                const url =
                    urlInput.value.trim();


                if (!url) {

                    return;

                }


                const lower =
                    url.toLowerCase();


                let type =
                    "image";


                if (
                    lower.includes(
                        ".mp4"
                    ) ||
                    lower.includes(
                        ".webm"
                    ) ||
                    lower.includes(
                        ".mov"
                    ) ||
                    lower.includes(
                        ".m4v"
                    )
                ) {

                    type =
                        "video";

                }


                addMedia(
                    url,
                    type,
                    url.split("/").pop() ||
                    "URL media"
                );


                urlInput.value =
                    "";

            }
        );


        /* =================================================
           RENDER MEDIA
        ================================================= */

        function renderMedia() {

            mediaList.innerHTML =
                "";


            if (
                mediaItems.length ===
                0
            ) {

                mediaList.innerHTML = `
                    <div class="empty-media">
                        NO MEDIA ADDED
                    </div>
                `;

                return;

            }


            mediaItems.forEach(
                function(
                    item,
                    index
                ) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "media-item";


                    const remove =
                        document.createElement(
                            "button"
                        );


                    remove.className =
                        "media-remove";


                    remove.textContent =
                        "×";


                    remove.addEventListener(
                        "click",
                        function() {

                            if (
                                item.source.startsWith(
                                    "blob:"
                                )
                            ) {

                                URL.revokeObjectURL(
                                    item.source
                                );

                            }


                            mediaItems.splice(
                                index,
                                1
                            );


                            renderMedia();

                        }
                    );


                    let preview;


                    if (
                        item.type ===
                        "video"
                    ) {

                        preview =
                            document.createElement(
                                "video"
                            );


                        preview.src =
                            item.source;


                        preview.muted =
                            true;


                        preview.loop =
                            true;


                        preview.playsInline =
                            true;


                        preview.controls =
                            true;


                    } else {

                        preview =
                            document.createElement(
                                "img"
                            );


                        preview.src =
                            item.source;


                        preview.alt =
                            item.name;

                    }


                    const info =
                        document.createElement(
                            "div"
                        );


                    info.className =
                        "media-info";


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "media-name";


                    name.textContent =
                        (
                            index +
                            1
                        ) +
                        ". " +
                        item.name;


                    const type =
                        document.createElement(
                            "div"
                        );


                    type.className =
                        "media-type";


                    type.textContent =
                        item.type
                            .toUpperCase();


                    info.appendChild(
                        name
                    );


                    info.appendChild(
                        type
                    );


                    card.appendChild(
                        preview
                    );


                    card.appendChild(
                        info
                    );


                    card.appendChild(
                        remove
                    );


                    mediaList.appendChild(
                        card
                    );

                }
            );

        }


        /* =================================================
           LOAD IMAGE
        ================================================= */

        function loadImage(
            src
        ) {

            return new Promise(
                function(
                    resolve,
                    reject
                ) {

                    const img =
                        new Image();


                    img.crossOrigin =
                        "anonymous";


                    img.onload =
                        function() {

                            resolve(
                                img
                            );

                        };


                    img.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not load image."
                                )
                            );

                        };


                    img.src =
                        src;

                }
            );

        }


        /* =================================================
           LOAD VIDEO
        ================================================= */

        function loadVideo(
            src
        ) {

            return new Promise(
                function(
                    resolve,
                    reject
                ) {

                    const video =
                        document.createElement(
                            "video"
                        );


                    video.crossOrigin =
                        "anonymous";


                    video.muted =
                        true;


                    video.playsInline =
                        true;


                    video.preload =
                        "auto";


                    video.onloadedmetadata =
                        function() {

                            resolve(
                                video
                            );

                        };


                    video.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not load video."
                                )
                            );

                        };


                    video.src =
                        src;


                    video.load();

                }
            );

        }


        /* =================================================
           DRAW MEDIA COVER
        ================================================= */

        function drawImageCover(
            ctx,
            image,
            width,
            height
        ) {

            const sourceWidth =
                image.videoWidth ||
                image.naturalWidth ||
                image.width;


            const sourceHeight =
                image.videoHeight ||
                image.naturalHeight ||
                image.height;


            if (
                !sourceWidth ||
                !sourceHeight
            ) {

                throw new Error(
                    "Media has no usable dimensions."
                );

            }


            const scale =
                Math.max(
                    width /
                        sourceWidth,
                    height /
                        sourceHeight
                );


            const drawWidth =
                sourceWidth *
                scale;


            const drawHeight =
                sourceHeight *
                scale;


            const x =
                (
                    width -
                    drawWidth
                ) / 2;


            const y =
                (
                    height -
                    drawHeight
                ) / 2;


            ctx.drawImage(
                image,
                x,
                y,
                drawWidth,
                drawHeight
            );

        }


        /* =================================================
           CREATE GIF
        ================================================= */

        createButton.addEventListener(
            "click",
            async function() {

                if (
                    mediaItems.length ===
                    0
                ) {

                    alert(
                        "Add at least one image or video first."
                    );

                    return;

                }


                if (
                    typeof GIF ===
                    "undefined"
                ) {

                    alert(
                        "The GIF encoder failed to load. Refresh the page and try again."
                    );

                    return;

                }


                createButton.disabled =
                    true;


                downloadButton.style.display =
                    "none";


                progressWrap.classList.add(
                    "show"
                );


                progressFill.style.width =
                    "0%";


                progressText.textContent =
                    "Preparing...";


                try {

                    const width =
                        Math.max(
                            32,
                            Math.min(
                                1200,
                                Number(
                                    document.getElementById(
                                        "gifWidth"
                                    ).value
                                ) ||
                                480
                            )
                        );


                    const height =
                        Math.max(
                            32,
                            Math.min(
                                1200,
                                Number(
                                    document.getElementById(
                                        "gifHeight"
                                    ).value
                                ) ||
                                480
                            )
                        );


                    const fps =
                        Math.max(
                            1,
                            Math.min(
                                60,
                                Number(
                                    document.getElementById(
                                        "fps"
                                    ).value
                                ) ||
                                12
                            )
                        );


                    const quality =
                        Number(
                            document.getElementById(
                                "quality"
                            ).value
                        ) ||
                        5;


                    const loop =
                        Number(
                            document.getElementById(
                                "loop"
                            ).value
                        );


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d",
                            {
                                willReadFrequently:
                                    true
                            }
                        );


                    const workerCount =
                        Math.max(
                            1,
                            Math.min(
                                2,
                                navigator.hardwareConcurrency ||
                                2
                            )
                        );


                    const gif =
                        new GIF({

                            workers:
                                workerCount,

                            quality:
                                quality,

                            width:
                                width,

                            height:
                                height,

                            workerScript:
                                "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js",

                            repeat:
                                loop,

                            background:
                                "#000000"

                        });


                    let frameCount =
                        0;


                    let duration =
                        0;


                    /* -----------------------------------------
                       Calculate frames and duration
                    ----------------------------------------- */

                    for (
                        let i = 0;
                        i <
                        mediaItems.length;
                        i++
                    ) {

                        const item =
                            mediaItems[i];


                        if (
                            item.type ===
                            "image"
                        ) {

                            frameCount++;

                            duration +=
                                1 / fps;

                        } else {

                            const video =
                                await loadVideo(
                                    item.source
                                );


                            const videoDuration =
                                Math.min(
                                    Number.isFinite(
                                        video.duration
                                    )
                                        ? video.duration
                                        : 0,
                                    10
                                );


                            const videoFrames =
                                Math.max(
                                    1,
                                    Math.ceil(
                                        videoDuration *
                                        fps
                                    )
                                );


                            frameCount +=
                                videoFrames;


                            duration +=
                                videoFrames /
                                fps;

                        }

                    }


                    let completedFrames =
                        0;


                    /* -----------------------------------------
                       Images
                    ----------------------------------------- */

                    for (
                        let i = 0;
                        i <
                        mediaItems.length;
                        i++
                    ) {

                        const item =
                            mediaItems[i];


                        if (
                            item.type !==
                            "image"
                        ) {

                            continue;

                        }


                        progressText.textContent =
                            "Loading frame " +
                            (
                                completedFrames +
                                1
                            ) +
                            " / " +
                            frameCount;


                        const image =
                            await loadImage(
                                item.source
                            );


                        ctx.clearRect(
                            0,
                            0,
                            width,
                            height
                        );


                        drawImageCover(
                            ctx,
                            image,
                            width,
                            height
                        );


                        gif.addFrame(
                            ctx,
                            {
                                copy:
                                    true,

                                delay:
                                    1000 /
                                    fps
                            }
                        );


                        completedFrames++;


                        progressFill.style.width =
                            (
                                (
                                    completedFrames /
                                    frameCount
                                ) *
                                70
                            ) +
                            "%";

                    }


                    /* -----------------------------------------
                       Videos
                    ----------------------------------------- */

                    for (
                        let i = 0;
                        i <
                        mediaItems.length;
                        i++
                    ) {

                        const item =
                            mediaItems[i];


                        if (
                            item.type !==
                            "video"
                        ) {

                            continue;

                        }


                        const video =
                            await loadVideo(
                                item.source
                            );


                        const videoDuration =
                            Math.min(
                                Number.isFinite(
                                    video.duration
                                )
                                    ? video.duration
                                    : 0,
                                10
                            );


                        const totalFrames =
                            Math.max(
                                1,
                                Math.ceil(
                                    videoDuration *
                                    fps
                                )
                            );


                        for (
                            let frame = 0;
                            frame <
                            totalFrames;
                            frame++
                        ) {

                            const time =
                                Math.min(
                                    frame /
                                        fps,

                                    Math.max(
                                        0,
                                        videoDuration -
                                        0.001
                                    )
                                );


                            await new Promise(
                                function(
                                    resolve
                                ) {

                                    function seeked() {

                                        video.removeEventListener(
                                            "seeked",
                                            seeked
                                        );


                                        resolve();

                                    }


                                    video.addEventListener(
                                        "seeked",
                                        seeked
                                    );


                                    video.currentTime =
                                        time;

                                }
                            );


                            ctx.clearRect(
                                0,
                                0,
                                width,
                                height
                            );


                            drawImageCover(
                                ctx,
                                video,
                                width,
                                height
                            );


                            gif.addFrame(
                                ctx,
                                {
                                    copy:
                                        true,

                                    delay:
                                        1000 /
                                        fps
                                }
                            );


                            completedFrames++;


                            progressFill.style.width =
                                (
                                    (
                                        completedFrames /
                                        frameCount
                                    ) *
                                    70
                                ) +
                                "%";


                            progressText.textContent =
                                "Encoding frames " +
                                Math.round(
                                    (
                                        completedFrames /
                                        frameCount
                                    ) *
                                    100
                                ) +
                                "%";

                        }

                    }


                    /* -----------------------------------------
                       GIF encoding
                    ----------------------------------------- */

                    progressText.textContent =
                        "Encoding GIF...";


                    progressFill.style.width =
                        "75%";


                    gif.on(
                        "progress",
                        function(value) {

                            const percent =
                                75 +
                                (
                                    value *
                                    25
                                );


                            progressFill.style.width =
                                percent +
                                "%";


                            progressText.textContent =
                                "Encoding GIF " +
                                Math.round(
                                    percent
                                ) +
                                "%";

                        }
                    );


                    gif.on(
                        "finished",
                        async function(blob) {

                            progressFill.style.width =
                                "100%";


                            progressText.textContent =
                                "Complete!";


                            if (
                                finalGifURL
                            ) {

                                URL.revokeObjectURL(
                                    finalGifURL
                                );

                            }


                            finalGifURL =
                                URL.createObjectURL(
                                    blob
                                );


                            previewBox.innerHTML = `
                                <img
                                    src="${finalGifURL}"
                                    alt="Generated GIF"
                                >
                            `;


                            const rawName =
                                document.getElementById(
                                    "fileName"
                                ).value.trim();


                            let filename =
                                rawName ||
                                "bacothn.gif";


                            if (
                                !filename
                                    .toLowerCase()
                                    .endsWith(
                                        ".gif"
                                    )
                            ) {

                                filename +=
                                    ".gif";

                            }


                            downloadButton.href =
                                finalGifURL;


                            downloadButton.download =
                                filename;


                            downloadButton.style.display =
                                "inline-block";


                            createButton.disabled =
                                false;


                            /* ---------------------------------
                               SEND ACTUAL GIF TO GIFGOL
                            --------------------------------- */

                            if (
                                typeof window
                                    .gifGolCreated ===
                                "function"
                            ) {

                                try {

                                    await window.gifGolCreated(
                                        blob,
                                        {

                                            filename:
                                                filename,

                                            prompt:
                                                "N/A",

                                            username:
                                                "Anonymous",

                                            width:
                                                width,

                                            height:
                                                height,

                                            fps:
                                                fps,

                                            frames:
                                                frameCount,

                                            duration:
                                                Number(
                                                    duration.toFixed(
                                                        3
                                                    )
                                                ),

                                            fileSize:
                                                blob.size

                                        }
                                    );


                                    console.log(
                                        "GIF sent to GIFGOL."
                                    );


                                } catch (
                                    webhookError
                                ) {

                                    console.error(
                                        "GIFGOL webhook error:",
                                        webhookError
                                    );

                                }

                            }

                        }
                    );


                    gif.on(
                        "abort",
                        function() {

                            throw new Error(
                                "GIF encoding was aborted."
                            );

                        }
                    );


                    gif.render();


                } catch (
                    error
                ) {

                    console.error(
                        "GIF creation error:",
                        error
                    );


                    progressText.textContent =
                        "Creation failed";


                    progressFill.style.width =
                        "0%";


                    alert(
                        "GIF creation failed:\n\n" +
                        error.message
                    );


                    createButton.disabled =
                        false;

                }

            }
        );


        /* =================================================
           CLEAR
        ================================================= */

        clearButton.addEventListener(
            "click",
            function() {

                mediaItems.forEach(
                    function(item) {

                        if (
                            item.source.startsWith(
                                "blob:"
                            )
                        ) {

                            URL.revokeObjectURL(
                                item.source
                            );

                        }

                    }
                );


                mediaItems = [];


                renderMedia();


                if (
                    finalGifURL
                ) {

                    URL.revokeObjectURL(
                        finalGifURL
                    );


                    finalGifURL =
                        null;

                }


                previewBox.innerHTML = `
                    <div class="preview-empty">
                        GIF PREVIEW WILL APPEAR HERE
                    </div>
                `;


                downloadButton.style.display =
                    "none";


                progressWrap.classList.remove(
                    "show"
                );


                progressFill.style.width =
                    "0%";


                progressText.textContent =
                    "0%";

            }
        );


    </script>


    <!-- =====================================================
         SITE SCRIPT
    ===================================================== -->

    <script src="script.js"></script>


    <!-- =====================================================
         GIFGOL
    ===================================================== -->

    <script src="gifgol.js"></script>


</body>
